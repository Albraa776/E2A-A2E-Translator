name: Build E2A & A2E Translator APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2a-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/translator.keystore" \
            -alias translator \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass translatorpass -keypass translatorpass \
            -dname "CN=E2A-A2E, OU=Mobile, O=Translator, L=NA, ST=NA, C=US"

      - name: Assemble release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -PBA_KEYSTORE_PATH="$RUNNER_TEMP/translator.keystore" \
            -PBA_KEYSTORE_PASS=translatorpass \
            -PBA_KEY_ALIAS=translator \
            -PBA_KEY_PASS=translatorpass

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/E2A_A2E.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: E2A-A2E-release-apk
          path: dist/E2A_A2E.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: E2A & A2E Translator — latest build
          make_latest: true
          body: |
            Automated build from commit `${{ github.sha }}`.

            Install `E2A_A2E.apk` on Android 8.0+ (minSdk 26).
            Features: English↔Arabic offline neural translation, live camera translation, image OCR with selectable copy.
          files: dist/E2A_A2E.apk
