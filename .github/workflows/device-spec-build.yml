name: Build Device Spec Extractor APK

on:
  push:
    branches: [master, main]
    paths:
      - 'app-device-spec/**'
      - '.github/workflows/device-spec-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-spec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x app-device-spec/gradlew

      - name: Assemble debug APK
        working-directory: app-device-spec
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        working-directory: app-device-spec
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Device-Spec-Extractor.apk
          ls -lh dist/
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Device-Spec-Extractor-debug-apk
          path: app-device-spec/dist/Device-Spec-Extractor.apk
          if-no-files-found: error
