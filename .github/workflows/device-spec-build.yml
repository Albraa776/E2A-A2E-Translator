name: Build Device Spec Extractor APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-spec-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/device-spec.keystore" \
            -alias device-spec \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass devicespecpass -keypass devicespecpass \
            -dname "CN=Device-Spec-Extractor, OU=Mobile, O=Extractor, L=NA, ST=NA, C=US"

      - name: Assemble debug APK
        run: |
          cd app-device-spec
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          cd app-device-spec
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Device-Spec-Extractor.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Device-Spec-Extractor-debug-apk
          path: dist/Device-Spec-Extractor.apk
          if-no-files-found: error