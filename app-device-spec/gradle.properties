# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enable KSP incremental build
ksp.incremental=true
ksp.useKSP2=true

# Enable compose compiler reports
android.compose.compilerReports=true
android.compose.useLiveLiterals=true

# Enable R8 full mode for release builds
android.r8.fullMode=true

# Enable parallel execution
org.gradle.parallel=true
org.gradle.caching=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Enable build features
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.compose=true